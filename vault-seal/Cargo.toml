[package]
name = "vault-seal"
version = "0.1.0"
edition = "2021"
description = "Seal files to a CrowdVault campaign key and open them once the key is revealed on-chain."
license = "MIT"

[lib]
name = "vault_seal"
path = "src/lib.rs"

[[bin]]
name = "vault-seal"
path = "src/main.rs"

[dependencies]
k256 = { version = "0.13", features = ["arithmetic", "expose-field"] }
sha2 = "0.10"
sha3 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
ring = "0.17"
blake3 = { version = "1", features = ["rayon", "zeroize"] }
libc = "0.2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
zeroize = "1"
crypto-bigint = { version = "0.5", default-features = false }
rayon = "1"

[dev-dependencies]
aes-gcm = { version = "0.10", features = ["stream"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Memory"] }
